[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-pricing-learning"
version = "0.1.0"
description = "Historical demand, price responses and pricing experiments"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3", "pandas>=2,<4", "scikit-learn>=1.3,<2", "matplotlib>=3.7,<4", "joblib>=1.3,<2"]

[project.optional-dependencies]
dev = ["pytest>=7,<10", "nbformat>=5.9,<6", "nbclient>=0.9,<1", "ipykernel>=6.25,<8"]
train = ["catboost>=1.2.8,<1.3", "threadpoolctl>=3,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
